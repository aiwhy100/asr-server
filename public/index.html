<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asr-server 试用</title>
<style>
  :root { --bg:#fffaf0; --ink:#2b2b2b; --muted:#777; --accent:#f5a623; --card:#fff; --line:#eadfcb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1b18; --ink:#eee; --muted:#aaa; --card:#2a2723; --line:#3a352e; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  #talk { width: 100%; padding: 28px 0; font-size: 20px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
  #talk.on { filter: brightness(.9); transform: scale(.98); }
  #talk:disabled { opacity: .5; cursor: default; }
  #partial { color: var(--muted); min-height: 1.6em; margin-top: 16px; }
  #final { font-size: 22px; font-weight: 600; min-height: 1.6em; }
  label { font-size: 13px; color: var(--muted); }
  input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; }
  .meta { font-size: 13px; color: var(--muted); }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>asr-server 试用 · Try it</h1>
  <p class="sub">按住按钮说一个「为什么」问题，松开后出结果。录音只在服务器内存里识别，不保存。<br>Hold the button, ask a question, release.</p>

  <div class="card">
    <button id="talk" disabled>按住说话 · Hold to talk</button>
    <div id="partial"></div>
    <div id="final"></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="card" id="tokenCard" hidden>
    <label for="token">服务器开启了令牌校验，填一个 ASR_TOKENS 里的令牌 · Token</label>
    <input id="token" autocomplete="off" spellcheck="false">
  </div>

  <p class="meta">状态 · Status：<span id="status">检查中…</span><br>
  协议见 <code>docs/protocol.md</code>；这一页用的是 WebSocket + pcm16。</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const talk = $('talk'), statusEl = $('status');
let ws = null, ctx = null, node = null, stream = null, pressed = false;

try { $('token').value = localStorage.getItem('asr-token') || ''; } catch {}
$('token').addEventListener('input', () => { try { localStorage.setItem('asr-token', $('token').value.trim()); } catch {} });

fetch('health').then((r) => r.json()).then((h) => {
  statusEl.textContent = h.asr ? '识别可用 · ready' : `识别不可用（${h.engine}）· not ready — 先运行 npm run download-model`;
  $('tokenCard').hidden = !h.auth;
  talk.disabled = !h.asr;
}).catch(() => { statusEl.textContent = '连不上服务器 · offline'; });

// AudioWorklet：把麦克风采样转成 16 位整数，每 100ms 发一块
const WORKLET = `
class Pcm extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(1600); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 32768 : s * 32767;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.slice().buffer); this.n = 0; }
    }
    return true;
  }
  flush() {}
}
registerProcessor('pcm', Pcm);`;

async function startMic() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  ctx = new AudioContext({ sampleRate: 16000 });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
  node = new AudioWorkletNode(ctx, 'pcm');
  // 松手后还会多录 200ms（见 up()），所以这里不看 pressed，麦克风关掉就不再发
  node.port.onmessage = (e) => { if (ws && ws.readyState === 1 && stream) ws.send(e.data); };
  ctx.createMediaStreamSource(stream).connect(node);
}
function stopMic() {
  stream?.getTracks().forEach((t) => t.stop());
  ctx?.close();
  stream = ctx = node = null;
}

function connect() {
  return new Promise((resolve, reject) => {
    if (ws && ws.readyState === 1) return resolve(ws);
    const url = new URL('asr/stream', location.href);
    url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => resolve(ws);
    ws.onerror = () => reject(new Error('WebSocket 连接失败'));
    ws.onclose = () => { ws = null; };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'partial') $('partial').textContent = m.text;
      if (m.type === 'final') {
        $('final').textContent = m.question || '（没听清 · not heard）';
        $('partial').textContent = m.text;
        $('meta').textContent = `录音 ${(m.audioMs / 1000).toFixed(1)} 秒，松开后 ${Date.now() - releasedAt} ms 出结果${m.truncated ? '（超过 15 秒，后面截掉了）' : ''}`;
      }
      if (m.type === 'error') { $('final').textContent = `出错：${m.message}`; }
    };
  });
}

let releasedAt = 0, micReady = null;
async function down(e) {
  e.preventDefault();
  if (pressed || talk.disabled) return;
  pressed = true;
  talk.classList.add('on');
  $('partial').textContent = ''; $('final').textContent = ''; $('meta').textContent = '';
  try {
    await connect();
    const token = $('token').value.trim();
    ws.send(JSON.stringify({ type: 'start', format: 'pcm16', ...(token ? { token } : {}) }));
    micReady = startMic();
    await micReady;
  } catch (err) {
    $('final').textContent = `出错：${err.message}`;
    up();
  }
}
function up() {
  if (!pressed) return;
  pressed = false;
  talk.classList.remove('on');
  releasedAt = Date.now();
  // 多录 200ms，免得截掉最后一个字
  const ready = micReady;
  setTimeout(async () => {
    await ready?.catch(() => {});   // 很快松手时，等麦克风真的打开了再关
    stopMic();
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'end' }));
  }, 200);
}
talk.addEventListener('pointerdown', down);
talk.addEventListener('pointerup', up);
talk.addEventListener('pointerleave', up);
talk.addEventListener('pointercancel', up);
</script>
</body>
</html>
